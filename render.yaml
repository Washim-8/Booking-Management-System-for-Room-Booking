# Render Blueprint Specification (Infrastructure as Code)
# Project: StayEase Hotel Room Booking Management System
# Framework: Laravel 10 (PHP 8.2 / Apache Docker Runtime)
# Database: PostgreSQL (Managed / Supabase Compatible)

services:
  # Web Service - Laravel 10 Application
  - type: web
    name: stayease-hotel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: StayEase Hotel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stayease-db
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  # Managed PostgreSQL Database
  - name: stayease-db
    plan: free
    databaseName: stayease_hotel
    user: stayease_user
